<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Responsive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>DKUMARJAJ | Question Paper Generator</title>

  <meta
    name="description"
    content="Create, customize, import, preview and print professional school examination question papers easily with DKUMARJAJ Question Paper Generator."
  >

  <meta
    name="keywords"
    content="DKUMARJAJ, Question Paper Generator, School Question Paper, Exam Paper Generator, Online Question Paper Maker, School Exam Paper Creator"
  >

  <meta name="author" content="DKUMARJAJ">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="favicon-96x96.png"
  >

  <!-- Theme -->
  <meta name="theme-color" content="#1a1a1a">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="app-header">

    <div class="logo-area">

      <span class="icon">📝</span>

      <div>

        <h1>
          Question Paper Generator

          <a
            href="https://www.google.com/search?q=DKUMARJAJ"
            target="_blank"
            rel="noopener noreferrer"
            title="Search DKUMARJAJ on Google"
            style="
              display: inline-flex;
              align-items: center;
              gap: 5px;
              margin-left: 8px;
              font-size: 0.55em;
              font-weight: 600;
              text-decoration: none;
              color: inherit;
              opacity: 0.75;
              vertical-align: middle;
              transition: opacity 0.2s ease;
            "
            onmouseover="this.style.opacity='1'"
            onmouseout="this.style.opacity='0.75'"
          >
            <span>🔍</span>
            <span>DKUMARJAJ</span>
          </a>

        </h1>

        <p>Build, import, preview &amp; print school exam papers</p>

      </div>

    </div>

  </header>


  <!-- ================= TOOLBAR ================= -->

  <nav class="sticky-toolbar">

    <div class="toolbar-group">

      <select id="addQuestionTypeSelect" class="form-control">

        <option value="mcq">Multiple Choice (MCQ)</option>

        <option value="fillInBlanks">Fill in the Blanks</option>

        <option value="trueFalse">True / False</option>

        <option value="matchFollowing">Match the Following</option>

        <option value="oneWord">One Word Answer</option>

        <option value="shortAnswer">Short Answer</option>

        <option value="longAnswer">Long Answer</option>

        <option value="numerical">Numerical / Solve</option>

        <option value="arrangeOrder">Arrange in Order</option>

        <option value="wordMeaning">Word Meaning / Grammar</option>

        <option value="essayLetter">Writing / Essay / Letter</option>

        <option value="drawDiagram">Draw / Diagram</option>

        <option value="standalone">Standalone Direct Question</option>

        <option value="custom">Custom Question</option>

      </select>

      <button id="btnAddQuestion" class="btn btn-primary">
        + Add Question
      </button>

      <button id="btnAddSection" class="btn btn-secondary">
        + Add Section
      </button>

    </div>


    <div class="toolbar-group">

      <button id="btnSaveDraft" class="btn btn-success">
        Save Draft
      </button>

      <button id="btnLoadDraft" class="btn btn-info">
        Load Draft
      </button>

      <button id="btnClearDraft" class="btn btn-warning">
        Clear Draft
      </button>

      <button id="btnImport" class="btn btn-outline">
        Import
      </button>

      <button id="btnExport" class="btn btn-outline">
        Export
      </button>

      <button id="btnTogglePreview" class="btn btn-accent">
        Preview Layout
      </button>

      <button id="btnPrint" class="btn btn-print">
        🖨️ Print / Save PDF
      </button>

    </div>

  </nav>


  <!-- ================= MAIN ================= -->

  <main class="main-container">

    <!-- Editor Panel -->

    <section id="editorPanel" class="panel editor-panel">

      <!-- Examination Details -->

      <div class="card details-card">

        <h2>Header &amp; Examination Details</h2>

        <div class="form-grid">


          <!-- School Name -->

          <div class="form-group span-2">

            <label for="schoolName">
              School Name
            </label>

            <input
              type="text"
              id="schoolName"
              placeholder="e.g. St. Xavier's High School"
              class="form-control"
            >

          </div>


          <!-- School Address -->

          <div class="form-group span-2">

            <label for="schoolAddress">
              School Address
            </label>

            <input
              type="text"
              id="schoolAddress"
              placeholder="e.g. Main Road, City, State - 400001"
              class="form-control"
            >

          </div>


          <!-- Examination Name -->

          <div class="form-group span-2">

            <label for="examName">
              Examination Name
            </label>

            <input
              type="text"
              id="examName"
              placeholder="e.g. Annual Examination 2025-26"
              class="form-control"
            >

          </div>


          <!-- Class -->

          <div class="form-group">

            <label for="className">
              Class / Grade
            </label>

            <input
              type="text"
              id="className"
              placeholder="e.g. Class VIII"
              class="form-control"
            >

          </div>


          <!-- Subject -->

          <div class="form-group">

            <label for="subjectName">
              Subject
            </label>

            <input
              type="text"
              id="subjectName"
              placeholder="e.g. Science"
              class="form-control"
            >

          </div>


          <!-- Full Marks -->

          <div class="form-group">

            <label for="fullMarks">
              Full Marks
            </label>

            <input
              type="text"
              id="fullMarks"
              placeholder="e.g. 80"
              class="form-control"
            >

          </div>


          <!-- Exam Time -->

          <div class="form-group">

            <label for="examTime">
              Exam Duration
            </label>

            <input
              type="text"
              id="examTime"
              placeholder="e.g. 3 Hours"
              class="form-control"
            >

          </div>


          <!-- Numbering -->

          <div class="form-group span-2">

            <label for="numberingScheme">
              Question Numbering Mode
            </label>

            <select
              id="numberingScheme"
              class="form-control"
            >

              <option value="restart">
                Restart numbering per section (1, 2, 3... per section)
              </option>

              <option value="continuous">
                Continuous numbering throughout paper (1 to N)
              </option>

            </select>

          </div>

        </div>

      </div>


      <!-- Question Canvas -->

      <div
        id="paperCanvas"
        class="paper-canvas"
      >
      </div>

    </section>


    <!-- Preview Panel -->

    <section
      id="previewPanel"
      class="panel preview-panel hidden"
    >

      <div class="preview-actions">

        <span>
          A4 Landscape Twin-Copy Live View
        </span>

        <button
          id="btnClosePreview"
          class="btn btn-sm btn-secondary"
        >
          Close Preview
        </button>

      </div>


      <div
        id="printContainer"
        class="print-container"
      >
      </div>

    </section>

  </main>


  <!-- ================= IMPORT / EXPORT MODAL ================= -->

  <div
    id="dataModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <h3 id="modalTitle">
        Import Data
      </h3>

      <p id="modalDescription">
        Paste JSON or JavaScript variable string below:
      </p>


      <textarea
        id="modalTextarea"
        class="form-control code-textarea"
        rows="12"
      ></textarea>


      <div class="modal-actions">

        <button
          id="btnModalSubmit"
          class="btn btn-primary"
        >
          Process Import
        </button>


        <button
          id="btnModalCopy"
          class="btn btn-secondary hidden"
        >
          Copy to Clipboard
        </button>


        <button
          id="btnModalClose"
          class="btn btn-outline"
        >
          Close
        </button>

      </div>

    </div>

  </div>


  <!-- JavaScript -->

  <script src="app.js"></script>

</body>

</html>
