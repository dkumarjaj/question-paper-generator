<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Question Paper Generator
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/print.css"
    >

</head>


<body>


<div class="app">


    <!-- =========================
         TOP HEADER
    ========================== -->

    <header class="top-header">

        <div>

            <h1>
                Question Paper Generator
            </h1>

            <p>
                Create, save and print question papers easily.
            </p>

        </div>


        <div class="header-actions">

            <span
                id="saveStatus"
                class="save-status"
            >
                Ready
            </span>


            <button
                id="previewBtn"
                type="button"
                class="primary-btn"
            >
                Preview Question Paper
            </button>

        </div>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">


        <!-- =========================
             QUESTION PAPER DETAILS
        ========================== -->

        <section class="card">

            <h2>
                Question Paper Details
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="schoolName">
                        School Name
                    </label>

                    <input
                        type="text"
                        id="schoolName"
                        value="ST. Columbus Public School, Ekdara, Jhajha"
                        placeholder="Enter school name"
                    >

                </div>



                <div class="form-group">

                    <label for="examName">
                        Examination Name
                    </label>

                    <input
                        type="text"
                        id="examName"
                        value="Half Yearly Examination - 2026"
                        placeholder="Half Yearly Examination"
                    >

                </div>



                <div class="form-group">

                    <label for="className">
                        Class
                    </label>

                    <input
                        type="text"
                        id="className"
                        value="CLASS: STD-"
                        placeholder="Class IV"
                    >

                </div>



                <div class="form-group">

                    <label for="subjectName">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subjectName"
                        placeholder="Computer"
                    >

                </div>



                <div class="form-group">

                    <label for="fullMarks">
                        Full Marks
                    </label>

                    <input
                        type="number"
                        id="fullMarks"
                        value="80"
                        placeholder="80"
                    >

                </div>



                <div class="form-group">

                    <label for="examTime">
                        Time
                    </label>

                    <input
                        type="text"
                        id="examTime"
                        value="2 Hours"
                        placeholder="2 Hours"
                    >

                </div>


            </div>

        </section>



        <!-- =========================
             QUESTION SECTIONS
        ========================== -->

        <section class="card">


            <div class="section-header">


                <div>

                    <h2>
                        Question Sections
                    </h2>

                    <p>
                        Add the types of questions you want.
                    </p>

                </div>



                <div class="add-section-area">


                    <select id="questionTypeSelect">

                        <option value="">
                            Select Question Type
                        </option>

                        <option value="mcq">
                            Tick the Correct Option
                        </option>

                        <option value="truefalse">
                            True / False
                        </option>

                        <option value="match">
                            Match the Following
                        </option>

                        <option value="oneword">
                            Answer in One Word
                        </option>

                        <option value="fillblank">
                            Fill in the Blanks
                        </option>

                        <option value="custom">
                            Custom Question Section
                        </option>

                    </select>


                    <button
                        id="addSectionBtn"
                        type="button"
                        class="primary-btn"
                    >
                        + Add Section
                    </button>


                </div>


            </div>



            <div id="sectionsContainer">


                <div class="empty-state">

                    <h3>
                        No Question Sections Added
                    </h3>

                    <p>
                        Select a question type and click
                        "Add Section".
                    </p>

                </div>


            </div>


        </section>



        <!-- =========================
             ACTION BUTTONS
        ========================== -->

        <section class="action-area">


            <button
                id="saveDraftBtn"
                type="button"
                class="secondary-btn"
            >
                Save Draft
            </button>


            <button
                id="loadDraftBtn"
                type="button"
                class="secondary-btn"
            >
                Load Draft
            </button>


            <button
                id="clearDraftBtn"
                type="button"
                class="danger-btn"
            >
                Clear Draft
            </button>


            <button
                id="previewBtnBottom"
                type="button"
                class="primary-btn"
            >
                Preview Question Paper
            </button>
            


            <button
                id="printBtn"
                type="button"
                class="dark-btn"
            >
                Print / Save PDF
            </button>


        </section>


    </main>


</div>



<!-- =========================
     PREVIEW MODAL
========================= -->

<div
    id="previewModal"
    class="preview-modal"
>


    <div class="preview-header">


        <h2>
            Question Paper Preview
        </h2>


        <div>


            <button
                id="printPreviewBtn"
                type="button"
                class="dark-btn"
            >
                Print
            </button>


            <button
                id="closePreviewBtn"
                type="button"
                class="danger-btn"
            >
                Close
            </button>


        </div>


    </div>



    <!-- =========================
         GENERATED QUESTION PAPER
    ========================== -->

    <div id="paperPreview">

    </div>


</div>



<!-- =========================
     HIDDEN PAGE MEASURER
========================= -->

<div id="pageMeasurer">

</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/sections.js"></script>

<script src="js/storage.js"></script>

<script src="js/generator.js"></script>

<script src="js/app.js"></script>


</body>

</html>
